<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <style>
      .t{font-size:15px;font-weight:700;fill:#111827}
      .s{font-size:12px;fill:#4B5563}
      .l{font-size:12px;fill:#374151}
      .la{font-size:12px;fill:#1D4ED8}
      .n{font-size:12px;font-weight:700;fill:#fff}
      .box{fill:#fff;stroke:#D1D5DB;stroke-width:1.2}
      .band{font-size:12px;font-weight:700;letter-spacing:.06em}
    </style>
  </defs>

  <rect width="1100" height="800" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#111827">Agente #2 · Soporte interno con RAG · Arquitectura preliminar</text>
  <text x="40" y="68" class="s">Un empleado pregunta, el agente busca en los documentos de la empresa y responde citando sus fuentes (o dice "no lo sé").</text>

  <!-- nube AWS -->
  <rect x="200" y="96" width="810" height="600" rx="14" fill="#FFF8F2" stroke="#E8762C" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="220" y="120" font-size="13" font-weight="700" fill="#C2410C">AWS · us-east-1</text>

  <!-- franjas -->
  <rect x="210" y="132" width="790" height="122" rx="10" fill="#EFF6FF" opacity=".7"/>
  <text x="222" y="150" class="band" fill="#1D4ED8">INGESTA  (una vez, o cuando cambian los documentos)</text>
  <text x="222" y="432" class="band" fill="#374151">CONSULTA  (cada pregunta)</text>

  <!-- ===== INGESTA ===== -->
  <!-- Admin -->
  <rect x="30" y="160" width="150" height="76" rx="10" class="box"/>
  <rect x="30" y="160" width="6" height="76" rx="3" fill="#2563EB"/>
  <text x="48" y="190" class="t">Admin (tú)</text>
  <text x="48" y="210" class="s">sube políticas, FAQ</text>
  <text x="48" y="226" class="s">y manuales (ficticios)</text>

  <!-- S3 documentos -->
  <rect x="240" y="160" width="200" height="80" rx="10" class="box"/>
  <rect x="240" y="160" width="6" height="80" rx="3" fill="#7AA116"/>
  <text x="258" y="188" class="t">S3 · documentos/</text>
  <text x="258" y="208" class="s">PDF, Markdown, Word</text>
  <text x="258" y="224" class="s">la "fuente de la verdad"</text>

  <!-- Knowledge Base -->
  <rect x="500" y="160" width="230" height="80" rx="10" class="box"/>
  <rect x="500" y="160" width="6" height="80" rx="3" fill="#01A88D"/>
  <text x="518" y="188" class="t">Bedrock Knowledge Base</text>
  <text x="518" y="208" class="s">corta los documentos en pedazos</text>
  <text x="518" y="224" class="s">(chunking) y los mantiene al día</text>

  <!-- Titan embeddings -->
  <rect x="790" y="160" width="200" height="80" rx="10" class="box"/>
  <rect x="790" y="160" width="6" height="80" rx="3" fill="#01A88D"/>
  <text x="808" y="188" class="t">Titan Embeddings</text>
  <text x="808" y="208" class="s">convierte texto en vectores</text>
  <text x="808" y="224" class="s">("coordenadas de significado")</text>

  <!-- S3 Vectors (compartido) -->
  <rect x="790" y="300" width="200" height="88" rx="10" class="box" stroke="#7AA116" stroke-width="2"/>
  <rect x="790" y="300" width="6" height="88" rx="3" fill="#7AA116"/>
  <text x="808" y="328" class="t">S3 Vectors</text>
  <text x="808" y="346" class="s">el vector store: guarda cada</text>
  <text x="808" y="362" class="s">pedazo + su vector + su fuente</text>
  <text x="808" y="378" class="s" font-style="italic">(se decide en el ADR · Fase 2)</text>

  <!-- flechas ingesta -->
  <line x1="180" y1="198" x2="238" y2="198" stroke="#2563EB" stroke-width="1.6" marker-end="url(#fa)"/>
  <line x1="440" y1="198" x2="498" y2="198" stroke="#2563EB" stroke-width="1.6" marker-end="url(#fa)"/>
  <line x1="730" y1="198" x2="788" y2="198" stroke="#2563EB" stroke-width="1.6" marker-end="url(#fa)"/>
  <line x1="890" y1="240" x2="890" y2="298" stroke="#2563EB" stroke-width="1.6" marker-end="url(#fa)"/>
  <text x="910" y="274" class="la">guarda vectores</text>

  <g>
    <circle cx="209" cy="198" r="12" fill="#2563EB"/><text x="209" y="202" class="n" text-anchor="middle">A1</text>
    <circle cx="469" cy="198" r="12" fill="#2563EB"/><text x="469" y="202" class="n" text-anchor="middle">A2</text>
    <circle cx="759" cy="198" r="12" fill="#2563EB"/><text x="759" y="202" class="n" text-anchor="middle">A3</text>
    <circle cx="890" cy="269" r="12" fill="#2563EB"/><text x="890" y="273" class="n" text-anchor="middle">A4</text>
  </g>

  <!-- ===== CONSULTA ===== -->
  <!-- Empleado -->
  <rect x="30" y="460" width="150" height="76" rx="10" class="box"/>
  <rect x="30" y="460" width="6" height="76" rx="3" fill="#374151"/>
  <text x="48" y="490" class="t">Empleado</text>
  <text x="48" y="510" class="s">"¿Cuántos días de</text>
  <text x="48" y="526" class="s">vacaciones tengo?"</text>

  <!-- API Gateway -->
  <rect x="240" y="460" width="200" height="76" rx="10" class="box"/>
  <rect x="240" y="460" width="6" height="76" rx="3" fill="#8C4FFF"/>
  <text x="258" y="490" class="t">API Gateway</text>
  <text x="258" y="510" class="s">HTTP API · POST /preguntar</text>
  <text x="258" y="526" class="s">límite de solicitudes</text>

  <!-- Lambda soporte -->
  <rect x="500" y="455" width="230" height="96" rx="10" class="box"/>
  <rect x="500" y="455" width="6" height="96" rx="3" fill="#ED7100"/>
  <text x="518" y="483" class="t">Lambda · agente de soporte</text>
  <text x="518" y="503" class="s">1) busca pedazos relevantes</text>
  <text x="518" y="519" class="s">2) le pide a Claude la respuesta</text>
  <text x="518" y="535" class="s">3) anota la traza</text>

  <!-- Claude -->
  <rect x="790" y="460" width="200" height="86" rx="10" class="box"/>
  <rect x="790" y="460" width="6" height="86" rx="3" fill="#01A88D"/>
  <text x="808" y="488" class="t">Bedrock · Claude</text>
  <text x="808" y="506" class="s">responde SOLO con los</text>
  <text x="808" y="522" class="s">pedazos, cita las fuentes,</text>
  <text x="808" y="538" class="s">y si no está: "no lo sé"</text>

  <!-- CloudWatch -->
  <rect x="790" y="600" width="200" height="76" rx="10" class="box"/>
  <rect x="790" y="600" width="6" height="76" rx="3" fill="#E7157B"/>
  <text x="808" y="628" class="t">CloudWatch Logs</text>
  <text x="808" y="648" class="s">trazas: tokens, costo,</text>
  <text x="808" y="664" class="s">tiempo y fuentes usadas</text>

  <!-- flechas consulta -->
  <line x1="180" y1="498" x2="238" y2="498" stroke="#374151" stroke-width="1.6" marker-end="url(#f)"/>
  <line x1="440" y1="498" x2="498" y2="498" stroke="#374151" stroke-width="1.6" marker-end="url(#f)"/>
  <!-- 3: Lambda -> KB retrieve -->
  <line x1="590" y1="455" x2="590" y2="242" stroke="#374151" stroke-width="1.6" marker-end="url(#f)"/>
  <text x="440" y="322" class="l">busca pedazos parecidos</text>
  <text x="440" y="338" class="l">a la pregunta (Retrieve)</text>
  <!-- KB <-> S3 Vectors -->
  <path d="M730,226 L760,226 L760,344 L788,344" fill="none" stroke="#374151" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#f)"/>
  <text x="640" y="372" class="l" text-anchor="end"></text>
  <!-- 4: KB -> Lambda (pedazos + fuente) -->
  <line x1="650" y1="242" x2="650" y2="453" stroke="#374151" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#f)"/>
  <text x="660" y="392" class="l">top 5 pedazos</text>
  <text x="660" y="408" class="l">+ documento fuente</text>
  <!-- 5: Lambda <-> Claude -->
  <line x1="730" y1="503" x2="788" y2="503" stroke="#374151" stroke-width="1.6" marker-start="url(#f)" marker-end="url(#f)"/>
  <!-- 6: respuesta al empleado -->
  <path d="M560,551 L560,590 L105,590 L105,538" fill="none" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#f)"/>
  <text x="220" y="610" class="l">respuesta + fuentes  (o "no lo sé")  ·  en segundos, sin "ticket"</text>
  <!-- 7: Lambda -> CloudWatch -->
  <path d="M700,551 L700,638 L788,638" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#f)"/>

  <g>
    <circle cx="209" cy="498" r="11" fill="#111827"/><text x="209" y="502" class="n" text-anchor="middle">1</text>
    <circle cx="469" cy="498" r="11" fill="#111827"/><text x="469" y="502" class="n" text-anchor="middle">2</text>
    <circle cx="590" cy="300" r="11" fill="#111827"/><text x="590" y="304" class="n" text-anchor="middle">3</text>
    <circle cx="650" cy="360" r="11" fill="#111827"/><text x="650" y="364" class="n" text-anchor="middle">4</text>
    <circle cx="759" cy="503" r="11" fill="#111827"/><text x="759" y="507" class="n" text-anchor="middle">5</text>
    <circle cx="330" cy="590" r="11" fill="#6B7280"/><text x="330" y="594" class="n" text-anchor="middle">6</text>
    <circle cx="745" cy="638" r="11" fill="#111827"/><text x="745" y="642" class="n" text-anchor="middle">7</text>
  </g>

  <!-- pie -->
  <text x="40" y="726" font-size="12" font-weight="700" fill="#C2410C">PRELIMINAR · puede cambiar en el camino</text>
  <text x="40" y="746" class="s">Fase 1: lo mismo en tu Mac (carpeta de documentos + vector store local + Claude).  Fase 2: esta arquitectura en AWS + ADR del vector store.</text>
  <text x="40" y="764" class="s">Fase 3: "no lo sé" + citas obligatorias + examen de 15–20 preguntas.  Seguridad: rol de IAM con mínimo privilegio, sin llaves.</text>
  <text x="40" y="782" class="s">Opcional: todo esto recreado con Terraform.</text>
</svg>
