<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
    <style>
      .t{font-size:15px;font-weight:700;fill:#111827}
      .s{font-size:12px;fill:#4B5563}
      .l{font-size:12px;fill:#374151}
      .la{font-size:12px;fill:#1D4ED8}
      .n{font-size:12px;font-weight:700;fill:#fff}
      .box{fill:#fff;stroke:#D1D5DB;stroke-width:1.2}
    </style>
  </defs>
  <rect width="1200" height="660" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#111827">Agente #2 · Soporte interno con RAG · Arquitectura en AWS</text>
  <text x="40" y="68" class="s">Un empleado pregunta, el agente busca en las políticas de la empresa y responde citando la fuente, o dice "no lo sé".</text>

  <rect x="210" y="96" width="810" height="500" rx="14" fill="#FFF8F2" stroke="#E8762C" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="230" y="122" font-size="13" font-weight="700" fill="#C2410C">AWS · us-east-1</text>

  <!-- Usuario -->
  <rect x="30" y="160" width="150" height="84" rx="10" class="box"/><rect x="30" y="160" width="6" height="84" rx="3" fill="#374151"/>
  <text x="48" y="188" class="t">Empleado</text>
  <text x="48" y="208" class="s">curl o examen.py</text>
  <text x="48" y="224" class="s">{"pregunta": "..."}</text>

  <!-- API Gateway -->
  <rect x="245" y="160" width="200" height="84" rx="10" class="box"/><rect x="245" y="160" width="6" height="84" rx="3" fill="#8C4FFF"/>
  <text x="263" y="188" class="t">API Gateway</text>
  <text x="263" y="208" class="s">HTTP API · POST /preguntar</text>
  <text x="263" y="224" class="s">2 solicitudes/seg (ráfaga 5)</text>

  <!-- Lambda -->
  <rect x="510" y="150" width="270" height="110" rx="10" class="box"/><rect x="510" y="150" width="6" height="110" rx="3" fill="#ED7100"/>
  <text x="528" y="176" class="t">Lambda · agente-soporte</text>
  <text x="528" y="196" class="s">busca → umbral 0.37 → Claude → traza</text>
  <text x="528" y="212" class="s">reglas: citar fuente, máx. 5 renglones,</text>
  <text x="528" y="228" class="s">"no lo sé" si no hay información</text>
  <text x="528" y="248" class="s">Python 3.14 · arm64 · máx. 2 a la vez</text>

  <!-- Claude -->
  <rect x="830" y="160" width="170" height="84" rx="10" class="box"/><rect x="830" y="160" width="6" height="84" rx="3" fill="#01A88D"/>
  <text x="846" y="188" class="t">Amazon Bedrock</text>
  <text x="846" y="208" class="s">Claude Haiku 4.5</text>
  <text x="846" y="224" class="s">perfil Global</text>

  <!-- S3 documentos -->
  <rect x="245" y="340" width="200" height="90" rx="10" class="box"/><rect x="245" y="340" width="6" height="90" rx="3" fill="#7AA116"/>
  <text x="263" y="368" class="t">S3 · documentos/</text>
  <text x="263" y="388" class="s">7 políticas de Nimbo</text>
  <text x="263" y="404" class="s">(empresa ficticia)</text>

  <!-- KB -->
  <rect x="510" y="340" width="270" height="90" rx="10" class="box"/><rect x="510" y="340" width="6" height="90" rx="3" fill="#01A88D"/>
  <text x="528" y="368" class="t">Bedrock Knowledge Base</text>
  <text x="528" y="388" class="s">corta en pedazos (~300 tokens) y los</text>
  <text x="528" y="404" class="s">vectoriza con Titan Embeddings V2</text>
  <text x="528" y="420" class="s">Retrieve: los 5 pedazos más parecidos</text>

  <!-- S3 Vectors -->
  <rect x="830" y="340" width="170" height="90" rx="10" class="box" stroke="#7AA116" stroke-width="2"/><rect x="830" y="340" width="6" height="90" rx="3" fill="#7AA116"/>
  <text x="846" y="368" class="t">S3 Vectors</text>
  <text x="846" y="388" class="s">pedazo + vector</text>
  <text x="846" y="404" class="s">+ documento fuente</text>
  <text x="846" y="420" class="s" font-style="italic">(ADR 001)</text>

  <!-- CloudWatch -->
  <rect x="830" y="480" width="170" height="84" rx="10" class="box"/><rect x="830" y="480" width="6" height="84" rx="3" fill="#E7157B"/>
  <text x="846" y="508" class="t">CloudWatch Logs</text>
  <text x="846" y="528" class="s">TRAZA: puntajes, tokens,</text>
  <text x="846" y="544" class="s">costo, tiempo, fuentes</text>

  <!-- flechas -->
  <line x1="180" y1="190" x2="243" y2="190" stroke="#374151" stroke-width="1.6" marker-end="url(#f)"/>
  <line x1="445" y1="190" x2="508" y2="190" stroke="#374151" stroke-width="1.6" marker-end="url(#f)"/>
  <path d="M245,232 L215,232 L215,280 L105,280 L105,246" fill="none" stroke="#6B7280" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#f)"/>
  <text x="40" y="300" class="l">respuesta + fuentes</text><text x="40" y="316" class="l">+ costo (JSON)</text>
  <line x1="645" y1="260" x2="645" y2="338" stroke="#374151" stroke-width="1.6" marker-end="url(#f)"/>
  <text x="655" y="324" class="l">pregunta → top 5 pedazos</text>
  <line x1="780" y1="385" x2="828" y2="385" stroke="#374151" stroke-width="1.4" marker-start="url(#f)" marker-end="url(#f)"/>
  <line x1="780" y1="202" x2="828" y2="202" stroke="#374151" stroke-width="1.6" marker-start="url(#f)" marker-end="url(#f)"/>
  <path d="M760,260 L760,300 L1008,300 L1008,522 L1002,522" fill="none" stroke="#374151" stroke-width="1.4" marker-end="url(#f)"/>
  <line x1="445" y1="385" x2="508" y2="385" stroke="#2563EB" stroke-width="1.6" marker-end="url(#fa)"/>
  <text x="452" y="410" class="la">Sync</text>

  <g>
    <circle cx="212" cy="190" r="11" fill="#111827"/><text x="212" y="194" class="n" text-anchor="middle">1</text>
    <circle cx="476" cy="190" r="11" fill="#111827"/><text x="476" y="194" class="n" text-anchor="middle">2</text>
    <circle cx="645" cy="280" r="11" fill="#111827"/><text x="645" y="284" class="n" text-anchor="middle">3</text>
    <circle cx="805" cy="385" r="11" fill="#111827"/><text x="805" y="389" class="n" text-anchor="middle">4</text>
    <circle cx="805" cy="202" r="11" fill="#111827"/><text x="805" y="206" class="n" text-anchor="middle">5</text>
    <circle cx="1008" cy="440" r="11" fill="#111827"/><text x="1008" y="444" class="n" text-anchor="middle">6</text>
    <circle cx="476" cy="385" r="11" fill="#2563EB"/><text x="476" y="389" class="n" text-anchor="middle">A</text>
  </g>

  <text x="40" y="622" class="s">Rol de IAM con mínimo privilegio (sin llaves): buscar solo en esta Knowledge Base y usar solo Claude Haiku 4.5.  Variables: KB_ID, UMBRAL (0.37), MODELO.</text>
  <text x="40" y="642" class="s">Examen automático de 25 preguntas: 25/25 · ~0.002 USD por pregunta · las preguntas sin relación (puntaje &lt; 0.37) no llegan a Claude.</text>
</svg>
